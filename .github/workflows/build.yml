name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup JDK 21
      uses: actions/setup-java@v3
      with: {java-version: '21'}
    - name: Build with Gradle
      run: ./gradlew build
    - name: Get the .jar
      uses: actions/upload-artifact@v3
      with:
        name: mod-jar
        path: build/libs/*.jar
